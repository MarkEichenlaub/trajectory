<!DOCTYPE html>
<html>
<head>
<script>
  // SPA redirect for GitHub Pages: encode the path into a query string so
  // the root index.html loads, then the restore script below puts it back.
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1).join('/') +
    '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
